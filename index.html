<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olex Apps</title>
  <style>
    :root { --bg: #ffffff; --text: #1d1d1f; --muted: #5f6368; --link: #0b57d0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111214; --text: #ececee; --muted: #a2a5ab; --link: #8ab4f8; }
    }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    a { color: var(--link); }
  </style>
</head>
<body>
<main>
  <h1>Olex Apps</h1>
  <p class="muted">Small mobile apps for players.</p>
  <p><strong>Neon Plates</strong>: a car database and garage tracker.
  <a href="privacy/">Privacy policy</a></p>
  <p>Contact: <a href="mailto:olexapps.dev@gmail.com">olexapps.dev@gmail.com</a></p>
</main>
</body>
</html>
